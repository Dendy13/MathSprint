steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mathsprint-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mathsprint-backend:latest'
      - '.'
    dir: 'backend'

  # Step 2: Push image ke Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mathsprint-backend:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/mathsprint-backend:latest'

  # Step 3: Deploy ke Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mathsprint-backend'
      - '--image=gcr.io/$PROJECT_ID/mathsprint-backend:$SHORT_SHA'
      - '--platform=managed'
      - '--region=$_REGION'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=ENVIRONMENT=production'
      - '--quiet'

substitutions:
  _REGION: 'asia-southeast2'

options:
  logging: CLOUD_LOGGING_ONLY
